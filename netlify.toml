[build]
  command = "pnpm run build"
  publish = "dist/frontend-segundo-parcial-sw2/browser"

[[redirects]]
  from = "/api/*"
  to = "http://3.132.29.25:4000/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/graphql"
  to = "http://3.132.29.25:4000/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/bi/*"
  to = "http://3.132.29.25:8000/:splat"
  status = 200
  force = true

# Esta regla para Angular (SPA) SIEMPRE debe ir de última
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
