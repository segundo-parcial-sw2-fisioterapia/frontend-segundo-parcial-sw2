<header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 min-w-0">
    <div class="w-1 h-5 rounded-full bg-primary-600 shrink-0"></div>
    <div class="flex items-center gap-1.5 text-sm min-w-0">
      <span class="text-gray-400 truncate hidden sm:inline">{{ breadcrumb().subsistema }}</span>
      <svg class="w-3.5 h-3.5 text-gray-300 shrink-0 hidden sm:inline" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
      </svg>
      <span class="font-semibold text-gray-700 truncate">{{ breadcrumb().modulo }}</span>
    </div>
  </div>

  <!-- Right side: user + logout -->
  <div class="flex items-center gap-3 shrink-0">

    <!-- Connected badge -->
    <div class="flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
      <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="hidden sm:inline">Conectado</span>
    </div>

    <!-- User avatar + name -->
    @if (usuario()) {
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-primary-600 flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-sm">
          {{ iniciales() }}
        </div>
        <div class="hidden md:block leading-tight">
          <p class="text-sm font-semibold text-gray-700 leading-none">{{ usuario()?.nombre }}</p>
          @if (usuario()?.correo) {
            <p class="text-[0.65rem] text-gray-400 leading-tight mt-0.5">{{ usuario()?.correo }}</p>
          }
        </div>
      </div>
    } @else {
      <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-xs font-bold shrink-0">
        A
      </div>
    }

    <!-- Separator -->
    <div class="w-px h-5 bg-gray-200"></div>

    <!-- Logout button -->
    <button
      (click)="cerrarSesion()"
      class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-red-600
             hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors"
      title="Cerrar sesión"
    >
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414
             1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293
             1.293z"
          clip-rule="evenodd"
        />
      </svg>
      <span class="hidden sm:inline">Salir</span>
    </button>
  </div>

</header>
