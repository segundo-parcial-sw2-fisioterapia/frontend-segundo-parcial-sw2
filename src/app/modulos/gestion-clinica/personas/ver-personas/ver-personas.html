@if (persona) {
  <div class="grid grid-cols-2 gap-x-6 gap-y-4">
    <div class="flex flex-col gap-0.5">
      <span class="text-[0.7rem] font-semibold text-gray-400 uppercase tracking-wide">Nombre</span>
      <span class="text-sm text-gray-800">{{ persona.nombre ?? '—' }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-[0.7rem] font-semibold text-gray-400 uppercase tracking-wide">Apellido</span>
      <span class="text-sm text-gray-800">{{ persona.apellido ?? '—' }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-[0.7rem] font-semibold text-gray-400 uppercase tracking-wide">C.I.</span>
      <span class="text-sm text-gray-800">{{ persona.ci ?? '—' }}</span>
    </div>
    <div class="flex flex-col gap-0.5">
      <span class="text-[0.7rem] font-semibold text-gray-400 uppercase tracking-wide">Teléfono</span>
      <span class="text-sm text-gray-800">{{ persona.telefono ?? '—' }}</span>
    </div>
  </div>
}
