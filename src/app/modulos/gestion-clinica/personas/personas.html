<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-800">Personas</h1>
      <p class="text-sm text-gray-500 mt-0.5">Registro de personas en el sistema</p>
    </div>
    <button (click)="abrirCrear()" class="btn-primary">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/></svg>
      Nueva Persona
    </button>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="personas()"
    [cargando]="cargando()"
    mensajeVacio="No hay personas registradas."
    (ver)="abrirVer($event)"
    (editar)="abrirEditar($event)"
    (eliminar)="eliminarPersona($event)"
  />

  <app-modal titulo="Nueva Persona" [abierto]="modalCrear()" (cerrar)="modalCrear.set(false)">
    <app-crear-personas (guardar)="crearPersona($event)" (cancelar)="modalCrear.set(false)" />
  </app-modal>

  <app-modal titulo="Editar Persona" [abierto]="modalEditar()" (cerrar)="modalEditar.set(false)">
    <app-editar-personas [persona]="personaSeleccionada()" (guardar)="editarPersona($event)" (cancelar)="modalEditar.set(false)" />
  </app-modal>

  <app-modal titulo="Detalle de Persona" [abierto]="modalVer()" (cerrar)="modalVer.set(false)">
    <app-ver-personas [persona]="personaSeleccionada()" />
  </app-modal>
</div>
