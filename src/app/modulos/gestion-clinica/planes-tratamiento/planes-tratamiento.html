<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Planes de Tratamiento</h1>
      <p class="text-sm text-gray-500 mt-1">Gestión de planes terapéuticos clínicos</p>
    </div>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="planes()"
    [cargando]="cargando()"
    mensajeVacio="No hay planes de tratamiento registrados"
    (ver)="abrirVer($event)"
    (editar)="abrirEditar($event)"
    (eliminar)="eliminarPlan($event)"
  />

  <app-modal titulo="Editar Plan de Tratamiento" [abierto]="modalEditar()" (cerrar)="modalEditar.set(false)">
    <app-editar-planes-tratamiento
      [plan]="planSeleccionado()"
      (guardar)="editarPlan($event)"
      (cancelar)="modalEditar.set(false)"
    />
  </app-modal>

  <app-modal titulo="Detalle Plan de Tratamiento" [abierto]="modalVer()" (cerrar)="modalVer.set(false)">
    <app-ver-planes-tratamiento [plan]="planSeleccionado()" />
  </app-modal>
</div>
