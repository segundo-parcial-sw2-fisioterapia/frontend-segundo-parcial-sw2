<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-800">Evaluaciones Iniciales</h1>
      <p class="text-sm text-gray-500 mt-0.5">Evaluaciones clínicas iniciales de pacientes</p>
    </div>
    <button (click)="abrirCrear()" class="btn-primary">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/></svg>
      Nueva Evaluación
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-xl p-5 shadow-[var(--shadow-card)] border border-gray-50 flex items-center gap-4">
      <div class="w-12 h-12 bg-primary-50 rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-6 h-6 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500">Programadas para Hoy</p>
        <p class="text-2xl font-bold text-gray-900">{{ evaluacionesHoy() }}</p>
      </div>
    </div>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="evaluaciones()"
    [cargando]="cargando()"
    mensajeVacio="No hay evaluaciones iniciales registradas"
    (ver)="abrirVer($event)"
    (editar)="abrirEditar($event)"
    (eliminar)="eliminarEvaluacion($event)"
  />

  <app-modal titulo="Nueva Evaluación Inicial" [abierto]="modalCrear()" (cerrar)="cerrarModalCrear()">
    <app-crear-evaluaciones-iniciales
      [pacientes]="pacientesBuscados()"
      [buscandoPaciente]="buscandoPaciente()"
      (buscarPaciente)="buscarPaciente($event)"
      (guardar)="crearEvaluacion($event)"
      (cancelar)="cerrarModalCrear()"
    />
  </app-modal>

  <app-modal titulo="Detalle Evaluación Inicial" [abierto]="modalVer()" (cerrar)="modalVer.set(false)">
    <app-ver-evaluaciones-iniciales [evaluacion]="evaluacionSeleccionada()" />
  </app-modal>
</div>
