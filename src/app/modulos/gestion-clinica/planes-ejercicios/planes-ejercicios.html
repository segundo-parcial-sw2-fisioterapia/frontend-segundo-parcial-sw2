<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-800">Planes de Ejercicios</h1>
      <p class="text-sm text-gray-500 mt-0.5">Ejercicios asignados a planes de tratamiento</p>
    </div>
    <button (click)="abrirCrear()" class="btn-primary">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/></svg>
      Nuevo Plan de Ejercicio
    </button>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="planes()"
    [cargando]="cargando()"
    mensajeVacio="No hay planes de ejercicios registrados"
    (ver)="abrirVer($event)"
    (editar)="abrirEditar($event)"
    (eliminar)="eliminarPlan($event)"
  />

  <app-modal titulo="Nuevo Plan de Ejercicio" [abierto]="modalCrear()" (cerrar)="modalCrear.set(false)">
    <app-crear-planes-ejercicios
      (guardar)="crearPlan($event)"
      (cancelar)="modalCrear.set(false)"
    />
  </app-modal>

  <app-modal titulo="Editar Plan de Ejercicio" [abierto]="modalEditar()" (cerrar)="modalEditar.set(false)">
    <app-editar-planes-ejercicios
      [plan]="planSeleccionado()"
      (guardar)="editarPlan($event)"
      (cancelar)="modalEditar.set(false)"
    />
  </app-modal>

  <app-modal titulo="Detalle Plan de Ejercicio" [abierto]="modalVer()" (cerrar)="modalVer.set(false)">
    <app-ver-planes-ejercicios [plan]="planSeleccionado()" />
  </app-modal>
</div>
