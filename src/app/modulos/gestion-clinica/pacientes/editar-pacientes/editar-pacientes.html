<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-5">
  
  <!-- Datos Personales -->
  <div class="border-b border-gray-150 pb-3 mb-4">
    <h3 class="text-sm font-semibold text-gray-800 uppercase tracking-wider">Datos Personales</h3>
  </div>
  
  <app-formulario-persona [formGroup]="$any(form.controls.persona)"></app-formulario-persona>

  <!-- Datos Clínicos -->
  <div class="border-b border-gray-150 pb-3 pt-2 mb-4">
    <h3 class="text-sm font-semibold text-gray-800 uppercase tracking-wider">Datos de Fisioterapia</h3>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Estado</label>
    <select formControlName="estado" class="input-base">
      <option value="">Seleccione...</option>
      <option value="ACTIVO">Activo</option>
      <option value="ALTA_MEDICA">Alta médica</option>
      <option value="INACTIVO">Inactivo</option>
    </select>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Sexo</label>
    <select formControlName="sexo" class="input-base">
      <option value="">Seleccione...</option>
      <option value="MASCULINO">Masculino</option>
      <option value="FEMENINO">Femenino</option>
      <option value="OTRO">Otro</option>
    </select>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Dirección</label>
    <input formControlName="direccion" type="text" placeholder="Dirección" class="input-base" />
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button type="button" (click)="cancelar.emit()" class="btn-secondary">Cancelar</button>
    <button type="submit" class="btn-primary">Guardar</button>
  </div>
</form>
