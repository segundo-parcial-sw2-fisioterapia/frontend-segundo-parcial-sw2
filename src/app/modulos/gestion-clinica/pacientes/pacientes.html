<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-800">Pacientes</h1>
      <p class="text-sm text-gray-500 mt-0.5">Gestión de pacientes del centro</p>
    </div>
    <button (click)="abrirCrear()" class="btn-primary">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/></svg>
      Nuevo Paciente
    </button>
  </div>

  <app-tabla
    [columnas]="columnas"
    [filas]="pacientes()"
    [cargando]="cargando()"
    mensajeVacio="No hay pacientes registrados."
    (ver)="abrirVer($event)"
    (editar)="abrirEditar($event)"
    (eliminar)="eliminarPaciente($event)"
  />

  <app-modal titulo="Nuevo Paciente" ancho="lg" [abierto]="modalCrear()" (cerrar)="cerrarModalCrear()">
    <app-crear-pacientes
      [personas]="personasBuscadas()"
      [buscandoPersonas]="buscandoPersonas()"
      (buscarPersonas)="buscarPersonas($event)"
      (guardar)="crearPaciente($event)"
      (cancelar)="cerrarModalCrear()"
    />
  </app-modal>

  <app-modal titulo="Editar Paciente" [abierto]="modalEditar()" (cerrar)="modalEditar.set(false)">
    <app-editar-pacientes [paciente]="pacienteSeleccionado()" (guardar)="editarPaciente($event)" (cancelar)="modalEditar.set(false)" />
  </app-modal>

  <app-modal titulo="Detalle de Paciente" [abierto]="modalVer()" (cerrar)="modalVer.set(false)">
    <app-ver-pacientes [paciente]="pacienteSeleccionado()" />
  </app-modal>
</div>
