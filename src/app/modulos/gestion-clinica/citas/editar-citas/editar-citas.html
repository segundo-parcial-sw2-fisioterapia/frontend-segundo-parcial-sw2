<form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-5">
  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Fecha y Hora</label>
    <input formControlName="fecha_hora" type="datetime-local" class="input-base" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Tipo</label>
    <select formControlName="tipo" class="input-base">
      <option value="">Seleccione...</option>
      <option value="PRIMERA_VEZ">Primera vez</option>
      <option value="CONTROL">Control</option>
      <option value="SEGUIMIENTO">Seguimiento</option>
    </select>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Estado</label>
    <select formControlName="estado" class="input-base">
      <option value="">Seleccione...</option>
      <option value="PROGRAMADA">Programada</option>
      <option value="CONFIRMADA">Confirmada</option>
      <option value="ASISTIDA">Asistida</option>
      <option value="CANCELADA">Cancelada</option>
      <option value="REPROGRAMADA">Reprogramada</option>
    </select>
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Duración (minutos)</label>
    <input formControlName="duracion_minutos" type="number" placeholder="Duración en minutos" class="input-base" />
  </div>

  <div class="flex flex-col gap-1">
    <label class="text-sm font-medium text-gray-700">Observaciones</label>
    <textarea formControlName="observaciones" rows="3" placeholder="Observaciones adicionales" class="input-base"></textarea>
  </div>

  <div class="flex justify-end gap-3 pt-2">
    <button type="button" (click)="cancelar.emit()" class="btn-secondary">Cancelar</button>
    <button type="submit" class="btn-primary">Guardar</button>
  </div>
</form>
