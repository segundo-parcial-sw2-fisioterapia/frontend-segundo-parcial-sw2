@if (asistencia) {
  <dl class="space-y-3">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">ID Empleado</dt>
        <dd class="mt-1 text-sm text-gray-800 font-mono">{{ asistencia.empleadoId }}</dd>
      </div>
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Fecha</dt>
        <dd class="mt-1 text-sm text-gray-800">{{ asistencia.fecha }}</dd>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Hora de entrada</dt>
        <dd class="mt-1 text-sm text-gray-800">{{ asistencia.horaEntrada }}</dd>
      </div>
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Hora de salida</dt>
        <dd class="mt-1 text-sm text-gray-800">{{ asistencia.horaSalida || '—' }}</dd>
      </div>
    </div>
    <div>
      <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Estado</dt>
      <dd class="mt-1">
        <span class="badge-base"
          [class.badge-verde]="asistencia.estado === 'presente'"
          [class.badge-amarillo]="asistencia.estado === 'tardanza' || asistencia.estado === 'justificado'"
          [class.badge-rojo]="asistencia.estado === 'ausente'">
          {{ asistencia.estado }}
        </span>
      </dd>
    </div>
  </dl>
}
