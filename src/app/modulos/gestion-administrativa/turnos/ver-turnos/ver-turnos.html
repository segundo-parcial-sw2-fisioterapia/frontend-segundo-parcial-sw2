@if (turno) {
  <dl class="space-y-3">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Empleado</dt>
        <dd class="mt-1 text-sm text-gray-800 font-medium">{{ turno.empleadoNombre || turno.empleadoId }}</dd>
      </div>
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Día</dt>
        <dd class="mt-1 text-sm text-gray-800 capitalize">{{ turno.diaSemana }}</dd>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Hora inicio</dt>
        <dd class="mt-1 text-sm text-gray-800">{{ turno.horaInicio }}</dd>
      </div>
      <div>
        <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Hora fin</dt>
        <dd class="mt-1 text-sm text-gray-800">{{ turno.horaFin }}</dd>
      </div>
    </div>
    <div>
      <dt class="text-xs font-medium text-gray-500 uppercase tracking-wide">Estado</dt>
      <dd class="mt-1">
        <span class="badge-base" [class.badge-verde]="turno.activo" [class.badge-rojo]="!turno.activo">
          {{ turno.activo ? 'Activo' : 'Inactivo' }}
        </span>
      </dd>
    </div>
  </dl>
}
