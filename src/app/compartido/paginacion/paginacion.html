@if (paginaInfo && paginaInfo.totalElementos > 0) {
  <div class="flex items-center justify-between px-1 py-3">

    <!-- Resumen de registros -->
    <p class="text-sm text-gray-500">
      Mostrando <span class="font-medium text-gray-700">{{ inicio }}</span>–<span class="font-medium text-gray-700">{{ fin }}</span>
      de <span class="font-medium text-gray-700">{{ paginaInfo.totalElementos }}</span> registros
    </p>

    <!-- Controles de paginación -->
    <div class="flex items-center gap-1">

      <!-- Primera página -->
      <button
        (click)="ir(0)"
        [disabled]="paginaInfo.primero"
        class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
        title="Primera página"
      >
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Anterior -->
      <button
        (click)="ir(paginaInfo.paginaActual - 1)"
        [disabled]="paginaInfo.primero"
        class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
        title="Página anterior"
      >
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Números de página -->
      @for (p of paginas; track p) {
        <button
          (click)="ir(p)"
          [class]="p === paginaInfo.paginaActual
            ? 'min-w-[32px] h-8 rounded-lg text-xs font-semibold bg-primary-600 text-white'
            : 'min-w-[32px] h-8 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-100 transition'"
        >
          {{ p + 1 }}
        </button>
      }

      <!-- Siguiente -->
      <button
        (click)="ir(paginaInfo.paginaActual + 1)"
        [disabled]="paginaInfo.ultimo"
        class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
        title="Página siguiente"
      >
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
        </svg>
      </button>

      <!-- Última página -->
      <button
        (click)="ir(paginaInfo.totalPaginas - 1)"
        [disabled]="paginaInfo.ultimo"
        class="p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-30 disabled:cursor-not-allowed transition"
        title="Última página"
      >
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0zm6 0a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 111.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
        </svg>
      </button>

    </div>
  </div>
}
